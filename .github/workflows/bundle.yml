name: Build bundle

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: snip-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Generate locally
        run: node scripts/build-bundle.mjs
      - name: Check CLI and dependencies
        run: |
          npm test --prefix cli
          npm audit --audit-level=high --prefix frontend
      - name: Publish bundle and pointers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git -C bundle push origin HEAD:refs/heads/bundle
          git push origin HEAD:refs/heads/main
      - name: Trigger image workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref main
